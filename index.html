<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapor Kurikulum Merdeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#0e2a2f; --muted:#5d7378; --line:#e1eae9; --bg:#f2f6f5; --card:#fff;
  --brand:#0f766e; --brand-d:#0a5550; --brand-l:#d8f1ed; --accent:#f59e0b; --accent-l:#fef3c7;
  --ok:#15803d; --ok-l:#dcfce7; --bad:#dc2626; --bad-l:#fee2e2; --info:#2563eb; --info-l:#dbeafe;
  --r:16px; --shadow:0 1px 2px rgba(14,42,47,.06),0 10px 28px rgba(14,42,47,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.hide{display:none!important}

/* ---------- Layout ---------- */
.side{position:fixed;inset:0 auto 0 0;width:256px;background:linear-gradient(175deg,#0a3a3a 0%,#0f766e 62%,#14917f 100%);color:#e8fbf8;display:flex;flex-direction:column;padding:20px 14px;z-index:40;transition:transform .25s}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 22px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#fde68a,#f59e0b);display:grid;place-items:center;color:#0a3a3a;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;color:#fff}
.brand span{font-size:11.5px;color:#a7e3da}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:transparent;color:#c9f0ea;cursor:pointer;text-align:left;font-weight:600;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7fcfc3;padding:16px 14px 6px;font-weight:700}
.me{margin-top:auto;background:rgba(0,0,0,.18);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.ava{width:38px;height:38px;border-radius:50%;background:#fde68a;color:#0a3a3a;font-weight:800;display:grid;place-items:center;flex:none}
.me div{min-width:0}.me b{display:block;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:#a7e3da;font-size:11.5px}
.main{margin-left:0;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 32px;position:sticky;top:0;background:rgba(242,246,245,.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;border:0;background:#fff;border-radius:11px;width:40px;height:40px;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.ta-chip{background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--brand-d);white-space:nowrap}
.page{padding:26px 32px 60px;max-width:1280px;width:100%}
.demo-bar{background:linear-gradient(90deg,#fef3c7,#fde68a);color:#6b4500;padding:9px 32px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #f6d77a}
.demo-bar b{font-weight:800}.demo-bar select,.demo-bar button{background:#fff;border:1px solid #e9c466;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px;font-weight:600}
.scrim{display:none}

/* ---------- Komponen ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#b9ccca;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28)}
.btn.pri:hover{background:var(--brand-d)}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#3b2600}
.btn.danger{background:#fff;color:var(--bad);border-color:#f3b4b4}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eef3f2;color:var(--muted)}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.bad{background:var(--bad-l);color:var(--bad)}.chip.warn{background:var(--accent-l);color:#92580a}.chip.info{background:var(--info-l);color:var(--info)}.chip.brand{background:var(--brand-l);color:var(--brand-d)}
.pred{display:inline-block;min-width:34px;text-align:center;padding:3px 9px;border-radius:8px;font-weight:800;font-size:12.5px}
.pred.A,.pred.SB{background:#bbf7d0;color:#14532d}.pred.D{background:#fecaca;color:#7f1d1d}.pred.B{background:#ccfbf1;color:#115e59}.pred.C{background:#fde68a;color:#78350f}.pred.PB{background:#fecaca;color:#7f1d1d}
.bar{height:8px;border-radius:99px;background:#e6efee;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#2dd4bf);transition:width .5s}
.hero{border-radius:22px;padding:28px 30px;color:#fff;background:radial-gradient(1200px 300px at 100% -20%,rgba(253,230,138,.35),transparent 60%),linear-gradient(120deg,#0a3a3a,#0f766e 70%,#14b8a6);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h2{font-size:25px;font-weight:800;margin-bottom:4px}.hero p{margin:0;color:#c9f0ea;max-width:620px}
.hero:after{content:'';position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.tile{padding:16px 18px;display:flex;gap:14px;align-items:center}
.tile .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand-d);flex:none}
.tile b{display:block;font-size:24px;font-weight:800;line-height:1.1}.tile span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.acard{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s;cursor:pointer;position:relative}
.acard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(14,42,47,.12);border-color:#b9ddd8}
.acard h3{font-size:17px;font-weight:800}
.acard .kls{display:inline-flex;gap:6px;align-items:center}
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}.sechead h2{font-size:16px;font-weight:800}
.tabs{display:flex;gap:6px;background:#e7efee;padding:5px;border-radius:14px;width:max-content;max-width:100%;overflow:auto;margin:16px 0}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 8px rgba(14,42,47,.1)}
.seg{display:inline-flex;background:#e7efee;border-radius:11px;padding:3px}.seg button{border:0;background:transparent;padding:6px 13px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ---------- Tabel nilai ---------- */
.tw{overflow:auto;border-radius:var(--r);max-height:calc(100vh - 330px);min-height:140px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:#f6faf9;z-index:3;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;vertical-align:bottom}
thead th small{display:block;text-transform:none;letter-spacing:0;font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis;color:#7d9296}
tbody tr:hover td{background:#fafdfc}
td.c,th.c{text-align:center}
.stk{position:sticky;left:0;background:#fff;z-index:2}.stk2{position:sticky;left:46px;background:#fff;z-index:2;box-shadow:2px 0 0 var(--line)}
thead th.stk,thead th.stk2{z-index:4;background:#f6faf9}
tbody tr:hover td.stk,tbody tr:hover td.stk2{background:#fafdfc}
.ni{width:68px;text-align:center;padding:7px 4px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-variant-numeric:tabular-nums;transition:.12s}
.ni:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.ni.low{background:#fff1f1;color:var(--bad);border-color:#f7caca}.ni.hi{background:#effcf4;color:var(--ok);border-color:#bde8cb}
.ni.dirty{border-color:var(--accent);background:#fffbeb;color:#92580a}.ni.err{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.ni:disabled{background:#f3f6f6;color:#a2b3b5;cursor:not-allowed;border-style:dashed}
.rem{display:block;font-size:10.5px;color:var(--info);font-weight:700;margin-top:2px}
.avg{font-weight:800;font-variant-numeric:tabular-nums}
.savebar{position:sticky;bottom:14px;margin-top:14px;display:flex;justify-content:flex-end;pointer-events:none;z-index:6}
.savebar>div{pointer-events:auto;background:#0e2a2f;color:#fff;padding:10px 12px 10px 20px;border-radius:16px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 40px rgba(14,42,47,.35)}
.savebar .btn{border:0}

/* ---------- Capaian ---------- */
.cap{padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.cap .n{width:40px;height:40px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800}
.cap p{margin:6px 0 0;font-size:15px;line-height:1.6}
.cap.mt p{opacity:.55;font-style:italic}
.cap .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.quote{border-left:4px solid var(--brand);background:#f3fbf9;padding:10px 14px;border-radius:0 12px 12px 0}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* ---------- Modal / toast ---------- */
.mback{position:fixed;inset:0;background:rgba(10,30,34,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal header{padding:20px 24px 4px;display:flex;align-items:center;gap:10px}.modal header h3{font-size:18px;font-weight:800;flex:1}
.modal .body{padding:10px 24px 8px}.modal footer{padding:14px 24px 22px;display:flex;gap:10px;justify-content:flex-end}
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
.inp,textarea.inp,select.inp{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.55}
.cnt{text-align:right;font-size:12px;color:var(--muted)}.cnt.bad{color:var(--bad);font-weight:700}
.note{padding:11px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--accent-l);color:#7a4a05}.note.bad{background:var(--bad-l);color:#8b1d1d}.note.info{background:var(--info-l);color:#1e40af}.note.ok{background:var(--ok-l);color:#14532d}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:99;max-width:min(420px,calc(100vw - 40px))}
.toast{background:#0e2a2f;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;gap:11px;align-items:flex-start;animation:slide .22s;border-left:4px solid #2dd4bf}
.toast.bad{border-color:#f87171}.toast.warn{border-color:var(--accent)}
.boot{position:fixed;inset:0;background:linear-gradient(150deg,#0a3a3a,#0f766e);display:grid;place-items:center;z-index:100;color:#fff;text-align:center;padding:20px}
.boot::after{content:'Versi 5.3 · login langsung';position:absolute;bottom:10px;left:0;right:0;font-size:11px;color:#8fd6cc;opacity:.8}
.boot .logo{width:68px;height:68px;border-radius:20px;margin:0 auto 18px}
.boot h2{font-size:24px;font-weight:800}.boot p{color:#b6ece4;max-width:440px;margin:8px auto 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fde68a;animation:rot .8s linear infinite;margin:20px auto 0}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,#e8f0ef 25%,#f4f8f7 37%,#e8f0ef 63%);background-size:400% 100%;animation:sh 1.3s infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}
.view-in{animation:vin .25s}@keyframes vin{from{opacity:0;transform:translateY(8px)}}


/* ---------- Checklist & setup ---------- */
.chk{padding:6px 22px 14px}.chk-row{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.chk-row:first-child{border-top:0}
.chk-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:#eef3f2;color:var(--muted)}
.chk-ic.ok{background:var(--ok-l);color:var(--ok)}.chk-ic.warn{background:var(--accent-l);color:#92580a}.chk-ic.todo{background:#fff;border:2px dashed #b9ccca}
.chk-t{flex:1;min-width:0}
.boot.lg{background:linear-gradient(160deg,#fdf3e7 0%,#fbe6d4 55%,#f9dcc6 100%);color:#4a3426}
.boot.lg::after{color:#b08c76}
.lgwrap{width:min(420px,92vw);margin:0 auto}
.lgbrand{font-size:13px;font-weight:700;letter-spacing:.06em;color:#a9744f;text-transform:uppercase;margin-bottom:14px}
.lgcard{background:#fffaf4;border-radius:26px;padding:34px 30px 26px;text-align:left;box-shadow:0 24px 60px rgba(176,120,82,.22),0 2px 0 #fff inset}
.lgcard h2{font-size:22px;font-weight:800;letter-spacing:.28em;text-align:center;color:#3d2b20;margin:0 0 26px}
.lgcard label{display:block;font-size:12.5px;font-weight:700;color:#8a6b58;margin:14px 0 6px}
.lgcard .in{width:100%;padding:13px 15px;border:1.5px solid #efdccd;border-radius:14px;background:#fff;font:inherit;font-size:15px;color:#3d2b20;outline:none;transition:.15s}
.lgcard .in:focus{border-color:#f0996b;box-shadow:0 0 0 4px rgba(240,153,107,.18)}
.lgcard .pw{position:relative}.lgcard .pw .in{padding-right:56px}
.lgcard .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:#a9744f;padding:8px;border-radius:10px;font-size:12px;font-weight:700}
.lgcard .go{width:100%;margin-top:22px;padding:14px;border:0;border-radius:15px;font:inherit;font-size:15px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#f9b48b,#ef8a5b);box-shadow:0 10px 24px rgba(239,138,91,.38);cursor:pointer;transition:.15s}
.lgcard .go:hover{filter:brightness(1.05);transform:translateY(-1px)}.lgcard .go:disabled{opacity:.6;cursor:wait;transform:none}
.lgcard .err{margin-top:14px;padding:10px 13px;border-radius:12px;background:#fde8e4;color:#a3321f;font-size:13px;font-weight:600}
.lgcard .inf{margin-top:14px;padding:10px 13px;border-radius:12px;background:#fdf0d5;color:#8a5a12;font-size:13px;font-weight:600}
.lgcard .foot{margin:20px 0 0;text-align:center;font-size:12.5px;color:#a58872}
.lgcard .hint{margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff1e3;font-size:12.5px;color:#8a6b58;line-height:1.9}
.lgcard .hint button{border:0;background:#fff;border-radius:8px;padding:3px 9px;margin:2px 4px 2px 0;font:inherit;font-size:12px;font-weight:700;color:#b9622f;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lgcard .note2{font-size:12.5px;color:#8a6b58;line-height:1.7;margin:-10px 0 4px;text-align:center}
.cell{width:100%;min-width:90px;border:1px solid transparent;background:transparent;padding:5px 7px;font:inherit;font-size:12.5px;border-radius:6px;color:inherit}
.cell:hover{border-color:#cfe0dc;background:#fff}.cell:focus{outline:none;border-color:var(--brand);background:#fff}.cell.dirty{background:#fff4d6;border-color:#f3c35b}
.edtable td{padding:2px 4px}.edtable th{white-space:nowrap}
.login-card{background:#fff;color:var(--ink);text-align:left;border-radius:22px;padding:26px 26px 22px;width:min(440px,92vw);margin:22px auto 0;box-shadow:0 30px 80px rgba(0,0,0,.32)}
.login-card h3{font-size:17px;margin:0 0 2px}.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.acc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line,#d9e5e2);border-radius:14px;background:#f6faf9;width:100%;text-align:left;font:inherit;color:inherit;cursor:default}
button.acc{cursor:pointer;transition:.15s}button.acc:hover{border-color:#0f766e;background:#ecfdf5}
.acc .ava{width:42px;height:42px;font-size:17px}.acc b{display:block;font-size:14.5px;line-height:1.25}.acc small{color:var(--muted);font-size:12px;word-break:break-all}
.login-card .big{width:100%;justify-content:center;margin-top:14px;padding:13px 16px;font-size:15px}
.login-card .lk{display:block;text-align:center;margin-top:14px;font-size:13px;color:#0f766e;font-weight:600;text-decoration:none;background:none;border:0;cursor:pointer;width:100%}
.login-card .lk:hover{text-decoration:underline}
.login-card .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0 10px}.login-card .sep:before,.login-card .sep:after{content:'';flex:1;height:1px;background:#e3ecea}
.login-card .accs{display:grid;gap:8px}.boot .school{color:#fde68a;font-weight:700;margin-top:6px;letter-spacing:.02em}
.setup-card{background:#fff;color:var(--ink);text-align:left;border-radius:20px;padding:24px;max-width:540px;margin:22px auto 0;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.setup-card ol{margin:0 0 14px;padding-left:20px;line-height:1.8}
code{background:#eef3f2;padding:1px 6px;border-radius:6px;font-size:12.5px}
.seg{flex-wrap:wrap}

/* ---------- Menu utama bergaya tombol warna ---------- */
.mgrp{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin:24px 0 10px}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:2px solid rgba(0,0,0,.14);cursor:pointer;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.12s;min-height:74px}
.mt:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.14)}.mt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.mt small{display:block;text-transform:none;font-weight:500;font-size:12px;letter-spacing:0;opacity:.88;margin-top:2px}
.mt .mi{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.32);display:grid;place-items:center;flex:none}
.note.big{padding:14px 16px;align-items:center;font-size:14px}
.usr{display:flex;gap:10px;align-items:center}.usr b{display:block;font-size:13px;line-height:1.2}.usr small{color:var(--muted);font-size:11.5px}

/** Nilai rapor sesuai lembar Excel (LEGER):
 *  M = rata-rata sumatif lingkup materi, N = sumatif tengah semester (STS), Q = rata-rata SAS (non-tes, tes).
 *  M saja → M | M+N → 40%M+60%N | M+Q → 40%M+60%Q | M+N+Q → rata-rata( 40%M+60%Q , N ) | tanpa M → kosong. */

function backupHarian() {
  var bk = CacheService.getScriptCache();
  if (bk.get('bk_lock')) return;               // maksimal satu salinan per 6 jam (pemanggilan berulang diabaikan)
  bk.put('bk_lock', '1', 21600);
  var ss = ss_();
  var it = DriveApp.getFoldersByName('_BACKUP');
  var folder = it.hasNext() ? it.next() : DriveApp.createFolder('_BACKUP');
  var stamp = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
  DriveApp.getFileById(ss.getId()).makeCopy('RAPOR-backup-' + stamp, folder);
  var cutoff = Date.now() - 90 * 86400000, files = folder.getFiles();
  while (files.hasNext()) {
    var f = files.next();
    if (f.getName().indexOf('RAPOR-backup-') === 0 && f.getDateCreated().getTime() < cutoff) f.setTrashed(true);
  }
}

 *  AUTH — login username/password milik aplikasi (tanpa validasi akun Google)
 *
 *  Alur:  login(username, password) → token acak (disimpan di CacheService, 6 jam)
 *         setiap panggilan berikutnya lewat rpc(token, namaFungsi, [argumen])
 *  Password tidak pernah disimpan polos: disimpan sebagai hash SHA-256 berulang + salt
 *  di sheet 05_GURU (kolom password_hash & salt).
 *  Peran: Guru (semua fitur penilaian & rapor) dan Admin (+ data master, akun, pengaturan, editor data).
 * ========================================================================== */

/* ---------- penjaga fungsi yang bisa dipanggil langsung dari browser ---------- */

/** Hanya pemilik script (menjalankan dari editor/menu Spreadsheet). */
function ownerOnly_() {

  try { a = String(Session.getActiveUser().getEmail() || '').toLowerCase(); o = String(Session.getEffectiveUser().getEmail() || '').toLowerCase(); } catch (e) { }
  if (!a || a !== o) throw new Error('Fungsi ini hanya dapat dijalankan pemilik script dari editor atau menu Spreadsheet.');

/* ---------- hash password ---------- */

function sha256hex_(str) {
  return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, str, Utilities.Charset.UTF_8)
    .map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join('');
}
function hashPw_(salt, pw) {
  var h = salt + '|' + pw;
  for (var i = 0; i < 200; i++) h = sha256hex_(h + '|' + salt);
  return h;
}
function makePw_(pw) {
  var salt = Utilities.getUuid().replace(/-/g, '');
  return { salt: salt, hash: hashPw_(salt, String(pw)) };
}
function checkPw_(g, pw) {
  if (!g || !g.salt || !g.password_hash) return false;
  var h = hashPw_(String(g.salt), String(pw)), x = String(g.password_hash), diff = h.length === x.length ? 0 : 1;
  for (var i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ (x.charCodeAt(i) || 0);
  return diff === 0;
}
function newToken_() { return (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, ''); }

function cleanUser_(u) {
  u = String(u || '').trim().toLowerCase();
  if (!/^[a-z0-9._-]{3,30}$/.test(u)) throw new Error('Username 3-30 karakter: huruf kecil, angka, titik, garis bawah atau strip (tanpa spasi).');
  return u;
}
function cleanPw_(p) {
  p = String(p === undefined || p === null ? '' : p);
  if (p.length < 6) throw new Error('Password minimal 6 karakter.');
  if (p.length > 100) throw new Error('Password maksimal 100 karakter.');
  return p;
}

function migrateGuru_(ss) {

    if (u.length < 3) u = ('guru' + String(r[0]).replace(/\D/g, '')).toLowerCase();
    var base = u, n = 1; while (used[u]) u = base + (++n); used[u] = 1;

var NA_VAL = ['sum_1', 'sum_2', 'sum_3', 'sum_4', 'sum_5', 'sum_6', 'sum_7', 'sum_8', 'sum_9', 'sum_10', 'nilai_sts', 'nilai_non_tes', 'nilai_tes', 'na_sumatif', 'na_sas', 'nilai_rapor', 'predikat'];

/** items: [{id_anggota, sum:[10 nilai], sts, non_tes, tes}] — nilai kosong boleh. */
function saveNilaiAkhir(idMK, items) {
  return wrap_(function () {
    return withLock_(function () {

        var vals = {}, bad = false;

        ['sts', 'non_tes', 'tes'].forEach(function (f) { var v = num_(it[f]); if (v !== null && !isInt100_(v)) bad = true; vals[f === 'sts' ? 'nilai_sts' : 'nilai_' + f] = v; });
        if (bad) { errors.push(nm + ': nilai harus bilangan bulat 0-100'); return; }

}

/* ----------------------------------------------------------------------------
 *  AUTO-GENERATE DESKRIPSI (Bagian 7 PRD)
 * -------------------------------------------------------------------------- */

function genCtx_() {
  var c = { cfg: cfg_() };
  c.kelasById = idx_(table_(S.KELAS).rows, 'id_kelas');
  c.anggotaById = idx_(table_(S.ANGGOTA).rows, 'id_anggota');
  c.mapelById = idx_(table_(S.MAPEL).rows, 'id_mapel');
  c.tpAll = table_(S.TP).rows; c.tpById = idx_(c.tpAll, 'id_tp');
  c.nilai = groupBy_(table_(S.NTP).rows, function (r) { return r.id_anggota + '|' + r.id_mapel; });
  c.cap = table_(S.CAP); c.capIdx = {};
  c.cap.rows.forEach(function (r) { c.capIdx[r.id_anggota + '|' + r.id_mapel] = r; });
  c.na = naIndex_();
  return c;
}

function itemTp_(tp) {
  return (String(tp.deskripsi_tp || '').trim() || String(tp.kode_tp || '')).replace(/[\s.;,]+$/, '');
}

function potongDiKataTerakhir_(text, max) {
  if (text.length <= max) return text;
  var cut = text.substring(0, max), sp = cut.lastIndexOf(' ');
  return (sp > 0 ? cut.substring(0, sp) : cut).replace(/[\s,;:]+$/, '');
}

/** Murni hitung (tanpa tulis). Mengembalikan {ok, rec} atau {ok:false, reason}. */
function computeCap_(ctx, idAnggota, idMapel, force) {
  var c = ctx.cfg, ang = ctx.anggotaById[idAnggota];
  if (!ang) return { ok: false, reason: 'ANGGOTA_TIDAK_ADA' };
  var kelas = ctx.kelasById[ang.id_kelas], existing = ctx.capIdx[idAnggota + '|' + idMapel];
  if (existing && isTrue_(existing.status_manual_edit) && !force) return { ok: false, reason: 'MANUAL_OVERRIDE_AKTIF' };
  var tps = ctx.tpAll.filter(function (t) { return t.id_mapel === idMapel && t.fase === kelas.fase && (!t.tingkat || String(t.tingkat) === String(kelas.tingkat)) && notFalse_(t.aktif); })
    .sort(function (a, b) { return (num_(a.urutan) || 0) - (num_(b.urutan) || 0); });
  if (!tps.length) return { ok: false, reason: 'NO_DATA', dinilai: 0, total: 0 };
  var map = {}; (ctx.nilai[idAnggota + '|' + idMapel] || []).forEach(function (r) { var v = nf_(r); if (v !== null) map[r.id_tp] = v; });
  var scored = tps.filter(function (t) { return map[t.id_tp] !== undefined; });
  if (!scored.length) return { ok: false, reason: 'INCOMPLETE', dinilai: 0, total: tps.length };

  var vals = scored.map(function (t) { return map[t.id_tp]; });
  var vmax = Math.max.apply(null, vals), vmin = Math.min.apply(null, vals);
  var hi = scored.filter(function (t) { return map[t.id_tp] === vmax; }).slice(0, 3);
  var lo = scored.filter(function (t) { return map[t.id_tp] === vmin; }).slice(0, 3);
  // Kategori per TP menurut KKTP mapel (sama dengan lembar Excel): A ≥ a | B ≥ b | C ≥ c | D < c
  var k = kktp_(ctx.mapelById[idMapel]), G = { A: [], B: [], C: [], D: [] };
  scored.forEach(function (t) { var v = map[t.id_tp]; G[v >= k.a ? 'A' : v >= k.b ? 'B' : v >= k.c ? 'C' : 'D'].push(itemTp_(t)); });
  var L = { A: c.l_a, B: c.l_b, C: c.l_c, D: c.l_d };
  function bagian(keys) { return keys.filter(function (x) { return G[x].length; }).map(function (x) { return L[x] + ' ' + G[x].join(c.sep) + '.'; }).join(' '); }
  var dT = bagian(['A', 'B']), dR = bagian(['C', 'D']);
  var fin = bagian(['A', 'B', 'C', 'D']), warn = '';
  if (fin.length > c.max_char) { fin = potongDiKataTerakhir_(fin, c.max_char - 3) + '...'; warn = 'TRUNCATED'; }
  return {
    ok: true, warn: warn,
    rec: {
      id_tp_tertinggi: hi.map(function (t) { return t.id_tp; }).join(';'), nilai_tertinggi: vmax, daftar_kode_tp_tinggi: hi.map(function (t) { return t.kode_tp; }).join('; '),
      id_tp_terendah: lo.map(function (t) { return t.id_tp; }).join(';'), nilai_terendah: vmin, daftar_kode_tp_rendah: lo.map(function (t) { return t.kode_tp; }).join('; '),
      deskripsi_tinggi: dT, deskripsi_rendah: dR, deskripsi_rapor: fin, batas_tuntas_saat_generate: k.c, versi_algoritma: VERSI_ALGO
    }
  };
}

/** Simpan hasil compute (batch, satu kali tulis). res = penghitung. force → reset manual. */
function persistCap_(ctx, results, res, force) {
  var email = (_mem.email || session_().email), changed = false;
  results.forEach(function (x) {
    var r = x.r, p = x.p;
    if (!r.ok) {
      if (r.reason === 'INCOMPLETE' || r.reason === 'NO_DATA') res.incomplete++;
      else if (r.reason === 'MANUAL_OVERRIDE_AKTIF') res.override++;
      return;
    }
    var key = p.id_anggota + '|' + p.id_mapel, ex = ctx.capIdx[key], naRow = ctx.na[key];
    if (naRow && isTrue_(naRow.status_final)) { res.locked = (res.locked || 0) + 1; return; }
    var base = {}; Object.keys(r.rec).forEach(function (k) { base[k] = r.rec[k]; });
    base.generated_at = now_(); base.generated_by = email;
    if (!ex) {
      base.id_capaian = newId_('CAP'); base.id_anggota = p.id_anggota; base.id_mapel = p.id_mapel; base.status_manual_edit = false; base.catatan_guru = '';
      ctx.cap.rows.push(base); ctx.capIdx[key] = base;
      log_(S.CAP, 'GENERATE', base.id_capaian, '', base.deskripsi_rapor, r.warn ? 'deskripsi dipotong (max_char)' : '');
    } else {
      var old = ex.deskripsi_rapor;
      Object.keys(base).forEach(function (k) { ex[k] = base[k]; });
      if (force) { ex.status_manual_edit = false; ex.catatan_guru = ''; }
      log_(S.CAP, 'GENERATE', ex.id_capaian, old, ex.deskripsi_rapor, r.warn ? 'deskripsi dipotong (max_char)' : '');
    }
    res.generated++; changed = true;
  });
  if (changed) {
    var t = ctx.cap, before = t.sh.getLastRow() - 1, rows = t.rows;
    var vals = rows.map(function (r) { return t.headers.map(function (h) { return out_(r[h]); }); });
    t.sh.getRange(2, 1, vals.length, t.headers.length).setValues(vals);
    rows.forEach(function (r, i) { r._row = i + 2; });
  }
}

function generateCapaian(idMK, idAnggota, force) {
  return wrap_(function () {
    return withLock_(function () {
      var a = mkAuth_(idMK), ang = anggotaAktif_(a.kelas.id_kelas).filter(function (x) { return x.id_anggota === idAnggota; })[0];
      if (!ang) throw new Error('Siswa bukan anggota aktif kelas ini.');
      var ctx = genCtx_(), res = { generated: 0, incomplete: 0, override: 0 };
      var r = computeCap_(ctx, idAnggota, a.mk.id_mapel, !!force);
      persistCap_(ctx, [{ p: { id_anggota: idAnggota, id_mapel: a.mk.id_mapel }, r: r }], res, !!force);
      if (!r.ok) return { ok: false, reason: r.reason, dinilai: r.dinilai, total: r.total, error: reasonText_(r) };
      return { ok: true, deskripsi: r.rec.deskripsi_rapor, locked: res.locked || 0 };
    });
  });
}

function reasonText_(r) {
  if (r.reason === 'INCOMPLETE') return 'Belum ada nilai formatif untuk TP mapel ini (' + r.dinilai + ' dari ' + r.total + ' TP).';
  if (r.reason === 'NO_DATA') return 'Belum ada TP aktif untuk mapel & tingkat ini.';
  if (r.reason === 'MANUAL_OVERRIDE_AKTIF') return 'Deskripsi sudah diedit manual. Gunakan "Kembalikan ke Otomatis".';
  return r.reason;
}

function generateKelas(idMK) {

      var results = list.map(function (x) { var p = { id_anggota: x.id_anggota, id_mapel: a.mk.id_mapel }; return { p: p, r: computeCap_(ctx, p.id_anggota, p.id_mapel, false) }; });
      persistCap_(ctx, results, res);

}

function generateSemua() {

      });

    });

}

function getCapaian(idMK) {
  return wrap_(function () {
    var a = mkAuth_(idMK), ctx = genCtx_(), idm = a.mk.id_mapel, c = ctx.cfg;
    var items = anggotaAktif_(a.kelas.id_kelas).map(function (x) {
      var key = x.id_anggota + '|' + idm, ex = ctx.capIdx[key], r = computeCap_(ctx, x.id_anggota, idm, true), na = ctx.na[key];
      var o = { id_anggota: x.id_anggota, nama: x.nama, no_absen: x.no_absen, locked: !!(na && isTrue_(na.status_final)), dinilai: r.dinilai, total: r.total };
      if (ex) {
        o.status = isTrue_(ex.status_manual_edit) ? 'MANUAL' : 'OTOMATIS'; o.deskripsi = ex.deskripsi_rapor; o.catatan = ex.catatan_guru; o.generated_at = ex.generated_at;
        o.nilai_tertinggi = ex.nilai_tertinggi; o.nilai_terendah = ex.nilai_terendah; o.kode_tinggi = ex.daftar_kode_tp_tinggi; o.kode_rendah = ex.daftar_kode_tp_rendah;
      } else if (r.ok) { o.status = 'SIAP'; o.deskripsi = r.rec.deskripsi_rapor; o.nilai_tertinggi = r.rec.nilai_tertinggi; o.nilai_terendah = r.rec.nilai_terendah; }
      else { o.status = r.reason; o.deskripsi = ''; }
      return o;
    });
    return { ok: true, mk: { id_mapel_kelas: idMK, nama_kelas: a.kelas.nama_kelas, nama_mapel: a.mapel.nama_mapel }, items: items, batas_tuntas: c.batas_tuntas, max_char: c.max_char };
  });
}

function overrideCapaian(idMK, idAnggota, teks, alasan) {
  return wrap_(function () {
    return withLock_(function () {
      var a = mkAuth_(idMK), ctx = genCtx_(), c = ctx.cfg, idm = a.mk.id_mapel;
      teks = String(teks || '').trim(); alasan = String(alasan || '').trim();
      if (!anggotaAktif_(a.kelas.id_kelas).some(function (x) { return x.id_anggota === idAnggota; })) throw new Error('Siswa bukan anggota aktif kelas ini.');
      if (!teks) throw new Error('Teks deskripsi tidak boleh kosong.');
      if (teks.length > c.max_char) throw new Error('Deskripsi maksimal ' + c.max_char + ' karakter (sekarang ' + teks.length + ').');
      if (alasan.length < 10) throw new Error('Alasan perubahan wajib diisi (minimal 10 karakter).');
      var key = idAnggota + '|' + idm, na = ctx.na[key];
      if (na && isTrue_(na.status_final)) throw new Error('Rapor sudah difinalisasi; deskripsi tidak dapat diubah.');
      var chk = computeCap_(ctx, idAnggota, idm, true), warning = '';
      var kk = kktp_(ctx.mapelById[idm]);
      if (chk.ok && chk.rec.nilai_terendah < kk.c && !/perlu/i.test(teks)) warning = 'Ada TP di bawah KKTP (' + kk.c + '), namun teks tidak memuat kata "perlu". Pastikan kelemahan tetap disebut.';
      var ex = ctx.capIdx[key], old = ex ? ex.deskripsi_rapor : '';
      if (!ex) {
        ex = { id_capaian: newId_('CAP'), id_anggota: idAnggota, id_mapel: idm, versi_algoritma: VERSI_ALGO, batas_tuntas_saat_generate: c.batas_tuntas };
        ctx.cap.rows.push(ex);
      }
      ex.deskripsi_rapor = teks; ex.status_manual_edit = true; ex.catatan_guru = alasan; ex.generated_at = now_(); ex.generated_by = session_().email;
      writeAllCap_(ctx);
      log_(S.CAP, 'OVERRIDE', ex.id_capaian, old, teks, alasan);
      return { ok: true, warning: warning };
    });
  });
}

  var t = ctx.cap, vals = t.rows.map(function (r) { return t.headers.map(function (h) { return out_(r[h]); }); });
  if (vals.length) t.sh.getRange(2, 1, vals.length, t.headers.length).setValues(vals);
  t.rows.forEach(function (r, i) { r._row = i + 2; });
}

  return wrap_(function () {
    return withLock_(function () {
      var a = mkAuth_(idMK), ctx = genCtx_(), idm = a.mk.id_mapel, key = idAnggota + '|' + idm, ex = ctx.capIdx[key];
      if (!ex) throw new Error('Belum ada deskripsi untuk siswa ini.');
      var na = ctx.na[key]; if (na && isTrue_(na.status_final)) throw new Error('Rapor sudah difinalisasi.');

      ex.status_manual_edit = false; ex.catatan_guru = ''; writeAllCap_(ctx);
      return { ok: true, deskripsi: ex.deskripsi_rapor, info: reasonText_(r) };
    });
  });
}

/** Simpan banyak baris TP sekaligus (gaya spreadsheet) untuk TINGKAT kelas terpilih. Semua-atau-tidak-sama-sekali. Panjang deskripsi tidak dibatasi. */
function saveTpBatch(idMK, items) {
  return wrap_(function () {
    return withLock_(function () {
      var a = mkAuth_(idMK), t = table_(S.TP), ting = a.kelas.tingkat;
      if (!items || !items.length) throw new Error('Tidak ada baris untuk disimpan.');
      if (items.length > 300) throw new Error('Maksimal 300 baris per simpan.');
      var mine = tpFor_(a.mk.id_mapel, a.kelas, false);
      var byId = idx_(mine, 'id_tp'), errors = [], warns = [], plan = [], seq = 0, used = {};
      items.forEach(function (tp, i) {
        var kode = String(tp.kode_tp || '').trim(), desk = String(tp.deskripsi_tp || '').trim(), no = i + 1;
        if (!tp.id_tp && !kode && !desk) return;                          // baris kosong diabaikan
        seq++;
        var urut = num_(tp.urutan); if (urut === null) urut = seq;
        if (!kode) kode = 'TP ' + seq;
        var err = '';
        if (!desk) err = 'deskripsi TP wajib diisi';
        else if (desk.length > 5000) err = 'deskripsi terlalu panjang (maks 5000 karakter)';
        else if (urut < 1) err = 'urutan harus angka >= 1';
        else if (tp.id_tp && !byId[tp.id_tp]) err = 'TP tidak ditemukan untuk mapel & tingkat ini';
        else if (used[kode.toLowerCase()]) err = 'kode "' + kode + '" dobel';
        if (err) { errors.push('Baris ' + no + ': ' + err); return; }
        used[kode.toLowerCase()] = 1;
        plan.push({ id_tp: tp.id_tp || '', kode: kode, desk: desk, urut: urut, aktif: tp.aktif !== false });
      });
      if (errors.length) throw new Error(errors.length + ' baris bermasalah, tidak ada yang disimpan:\n' + errors.slice(0, 10).join('\n') + (errors.length > 10 ? '\n…' : ''));
      var planIds = {}; plan.forEach(function (p) { if (p.id_tp) planIds[p.id_tp] = 1; });
      mine.forEach(function (r) { if (!planIds[r.id_tp] && used[String(r.kode_tp).toLowerCase()]) errors.push('Kode "' + r.kode_tp + '" bentrok dengan TP lain yang tidak ikut disimpan.'); });
      if (errors.length) throw new Error(errors.join('\n'));
      var kodeMapel = String(a.mapel.kode_mapel || a.mapel.id_mapel.replace(/^MPL-/, '')).toUpperCase(), upd = 0, added = [];
      plan.forEach(function (p) {
        var ex = p.id_tp ? byId[p.id_tp] : null;
        if (ex) {
          if (!ex.tingkat && !p.aktif) return;                            // TP lama yang tidak dicentang: dibiarkan (milik tingkat lain)
          var claim = !ex.tingkat;                                        // TP lama: kunci ke tingkat ini
          if (claim || ex.kode_tp !== p.kode || ex.deskripsi_tp !== p.desk || num_(ex.urutan) !== p.urut || notFalse_(ex.aktif) !== p.aktif) {
            log_(S.TP, 'UPDATE', ex.id_tp, ex.kode_tp + ' | ' + ex.deskripsi_tp + ' | ' + ex.aktif, p.kode + ' | ' + p.desk + ' | ' + p.aktif, 'tingkat ' + ting);
            ex.kode_tp = p.kode; ex.deskripsi_tp = p.desk; ex.urutan = p.urut; ex.aktif = p.aktif; ex.tingkat = ting; upd++;
          }
        } else {
          var id = 'TP-' + kodeMapel + '-' + a.kelas.fase + ting + '-' + pad_(p.urut, 3), base = id, n = 1;
          while (t.rows.some(function (r) { return r.id_tp === id; }) || added.some(function (r) { return r.id_tp === id; })) id = base + '-' + (++n);

function saveSettings(v) {
  return wrap_(function () {
    adminOnly_();

      var cur = cfg_(), out = {};
      function intIn(k, label, min, max) {
        var n = Number(v[k]);
        if (v[k] === '' || v[k] === null || v[k] === undefined || !Number.isInteger(n) || n < min || n > max) throw new Error(label + ' harus bilangan bulat ' + min + '-' + max + '.');

      }
      out.tahun_ajaran = String(v.tahun_ajaran || '').trim();
      if (!/^\d{4}\/\d{4}$/.test(out.tahun_ajaran)) throw new Error('Tahun ajaran harus berformat 2026/2027.');
      out.semester = String(v.semester);
      if (out.semester !== '1' && out.semester !== '2') throw new Error('Semester harus 1 atau 2.');
      out.bobot_sumatif = intIn('bobot_sumatif', 'Bobot sumatif lingkup materi', 0, 100);
      out.bobot_sas = intIn('bobot_sas', 'Bobot sumatif akhir semester (SAS)', 0, 100);

      if (total !== 100) throw new Error('Total bobot harus 100 (sekarang ' + total + ').');
      out.batas_tuntas = intIn('batas_tuntas', 'KKTP predikat C', 40, 90);
      out.kktp_b = intIn('kktp_b', 'KKTP predikat B', 41, 98);

      out.sep = String(v.sep === undefined || v.sep === '' ? '; ' : v.sep);

      var changedScore = out.bobot_sumatif !== cur.bobot_sumatif || out.bobot_sas !== cur.bobot_sas || out.batas_tuntas !== cur.batas_tuntas || out.kktp_b !== cur.kktp_b || out.kktp_a !== cur.kktp_a;

      var t = table_(S.CONFIG), idx = idx_(t.rows, 'key'), add = [];

        } else { add.push({ key: key, value: val, keterangan: '' }); log_(S.CONFIG, 'INSERT', key, '', val, 'pengaturan sekolah'); }
      });

      var ref = table_(S.REF), touched = false;
      ref.rows.forEach(function (r) {
        if (r.jenis_ref !== 'PREDIKAT') return;
        if (r.kode === 'A') { r.nilai_min = out.kktp_a; touched = true; }
        if (r.kode === 'B') { r.nilai_min = out.kktp_b; r.nilai_max = out.kktp_a - 1; touched = true; }
        if (r.kode === 'C') { r.nilai_min = out.batas_tuntas; r.nilai_max = out.kktp_b - 1; touched = true; }
        if (r.kode === 'D') { r.nilai_max = out.batas_tuntas - 1; touched = true; }
      });
      if (touched) writeCols_(ref, ['nilai_min', 'nilai_max']);
      delete _mem.cfg;

      return { ok: true };
    });
  });

function faseDariTingkat_(t) { return t <= 2 ? 'A' : t <= 4 ? 'B' : t <= 6 ? 'C' : t <= 9 ? 'D' : t === 10 ? 'E' : 'F'; }

function cleanFields_(def, rec, forImport) {
  var out = {};
  def.fields.forEach(function (f) {
    var raw = rec[f.k]; if (raw === undefined || raw === null) raw = '';
    if (typeof raw === 'string') raw = raw.trim();
    if (raw === '' && f.d !== undefined) raw = f.d;
    if (raw === '') { if (f.req) throw new Error(f.l + ' wajib diisi.'); out[f.k] = f.t === 'bool' ? false : ''; return; }
    if (f.t === 'email') {
      raw = String(raw).toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) throw new Error('Email tidak valid: ' + raw);
    } else if (f.t === 'number') {
      var n = Number(raw);
      if (isNaN(n) || !Number.isInteger(n)) throw new Error(f.l + ' harus bilangan bulat.');
      if ((f.min !== undefined && n < f.min) || (f.max !== undefined && n > f.max)) throw new Error(f.l + ' harus antara ' + f.min + ' dan ' + f.max + '.');
      raw = n;
    } else if (f.t === 'bool') {
      raw = raw === true || /^(true|1|ya|aktif)$/i.test(String(raw));
    } else if (f.t === 'select') {
      raw = String(raw);
      var hit = f.o.filter(function (o) { return o.toLowerCase() === raw.toLowerCase(); })[0];
      if (hit === undefined) throw new Error(f.l + ' harus salah satu dari: ' + f.o.join(', ') + '.');
      raw = hit;
    } else if (f.t === 'date') {
      raw = String(raw);
      var d = raw.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (d) raw = d[3] + '-' + pad_(d[2], 2) + '-' + pad_(d[1], 2);
      if (!/^\d{4}-\d{2}-\d{2}/.test(raw)) throw new Error(f.l + ' harus berformat yyyy-mm-dd.');
      raw = raw.slice(0, 10);
    } else {
      raw = String(raw);
      if (f.k === 'nisn' && forImport && /^\d{6,9}$/.test(raw)) raw = pad_(raw, 10);
      if (f.upper) raw = raw.toUpperCase();
      if (f.re && !f.re.test(raw)) throw new Error(f.reMsg || (f.l + ' tidak valid.'));
    }
    out[f.k] = raw;
  });
  return out;
}

/** Validasi + susun objek siap tulis. ex = baris lama (update) atau null (baru). */

  var clean = cleanFields_(def, ex ? mergeRec_(def, rec, ex) : rec, forImport);
  if (ex) {

    obj = {}; Object.keys(ex).forEach(function (k) { obj[k] = ex[k]; });
    Object.keys(clean).forEach(function (k) { obj[k] = clean[k]; });
  } else { obj = clean; }
  var self = ex ? ex[def.key] : null, i;

  if (ent === 'mapel') {
    var kk = ctx.kode[obj.kode_mapel]; if (kk && kk !== self) throw new Error('Kode mapel ' + obj.kode_mapel + ' sudah dipakai.');
    var kc = num_(obj.kktp_c), kb = num_(obj.kktp_b), ka = num_(obj.kktp_a);
    if (kc !== null && kb !== null && ka !== null && !(kc < kb && kb < ka)) throw new Error('KKTP harus berurutan C < B < A (mis. 75, 83, 92).');
    if (!ex) obj.id_mapel = 'MPL-' + obj.kode_mapel;
    if (!ex && ctx.mapel[obj.id_mapel]) throw new Error('ID ' + obj.id_mapel + ' sudah ada.');
    ctx.kode[obj.kode_mapel] = obj.id_mapel; ctx.mapel[obj.id_mapel] = obj;
  } else if (ent === 'kelas') {

    if (!ex) {
      obj.id_kelas = 'KLS-' + String(obj.tahun_ajaran).slice(0, 4) + '-' + obj.nama_kelas.replace(/\s+/g, '').toUpperCase();
      if (ctx.kelas[obj.id_kelas]) throw new Error('Kelas ' + obj.nama_kelas + ' untuk TA ' + obj.tahun_ajaran + ' sudah ada.');
    }

  } else if (ent === 'siswa') {
    var ns = ctx.nisn[obj.nisn]; if (ns && ns !== self) throw new Error('NISN ' + obj.nisn + ' sudah terdaftar.');
    if (!ex) { ctx.seq.siswa++; obj.id_siswa = 'SIS-' + ctx.year + '-' + pad_(ctx.seq.siswa, 4); obj.created_at = now; }
    obj.updated_at = now; ctx.nisn[obj.nisn] = obj.id_siswa; ctx.siswa[obj.id_siswa] = obj;
  } else if (ent === 'anggota') {

    if (!k) throw new Error('Kelas tidak ditemukan.'); if (!s) throw new Error('Siswa tidak ditemukan.');
    if (!ex) {
      if (k.status !== 'Aktif') throw new Error('Kelas ' + k.nama_kelas + ' tidak aktif.');
      if (s.status !== 'Aktif') throw new Error('Siswa ' + s.nama_siswa + ' tidak berstatus Aktif.');
      if (ctx.agt[obj.id_siswa + '|' + obj.id_kelas]) throw new Error(s.nama_siswa + ' sudah terdaftar di kelas ' + k.nama_kelas + '.');
      ctx.seq.anggota++; obj.id_anggota = 'AGT-' + pad_(ctx.seq.anggota, 6);
      if (!obj.tanggal_masuk) obj.tanggal_masuk = now.slice(0, 10);
      ctx.agt[obj.id_siswa + '|' + obj.id_kelas] = obj.id_anggota;
    }
  }
  return obj;
}

/** Tulis baris ke sheet (format teks untuk kolom non-angka agar nol di depan tidak hilang). */

      else { writeRows_(def, t, [obj], true); log_(def.sheet, 'INSERT', obj[def.key], '', obj[def.title] || '', 'data master'); }

/** Impor dari tempelan Excel/CSV. commit=false → hanya cek (pratinjau). */
function importMaster(ent, text, commit) {
  return wrap_(function () {
    adminOnly_();
    var def = masters_()[ent]; if (!def || !def.imp) throw new Error('Impor tidak tersedia untuk data ini.');
    var lines = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length < 2) throw new Error('Tempel minimal 1 baris header dan 1 baris data.');
    if (lines.length > 501) throw new Error('Maksimal 500 baris per impor.');
    var delim = lines[0].indexOf('\t') >= 0 ? '\t' : lines[0].indexOf(';') >= 0 ? ';' : ',';
    function split(l) { return l.split(delim).map(function (x) { return x.trim().replace(/^"|"$/g, ''); }); }
    var alias = {}; def.fields.forEach(function (f) { alias[f.k] = f.k; alias[f.l.toLowerCase()] = f.k; });
    alias['nama_kelas'] = 'nama_kelas'; alias['nama kelas'] = 'nama_kelas'; alias['kelas'] = 'nama_kelas'; alias['nama'] = def.fields[0].k;
    var head = split(lines[0]).map(function (h) { h = h.toLowerCase(); return alias[h] || h; });
    var need = def.imp.filter(function (k) { return !(ent === 'siswa' && k === 'nama_kelas') && ['nisn', 'nama_siswa', 'nama_guru', 'email', 'nama_kelas'].indexOf(k) >= 0 || ['nip', 'nis', 'no_absen', 'jenis_kelamin', 'tempat_lahir', 'tanggal_lahir', 'agama', 'pendidikan_sebelumnya', 'alamat', 'nama_ayah', 'nama_ibu', 'pekerjaan_ayah', 'pekerjaan_ibu', 'alamat_ortu', 'nama_wali'].indexOf(k) < 0; });
    need.forEach(function (k) { if (head.indexOf(k) < 0) throw new Error('Kolom "' + k + '" tidak ditemukan pada header. Kolom yang dikenali: ' + def.imp.join(', ') + '.'); });

    var work = function () {
      var t = table_(def.sheet), ctx = mctx_(), errors = [], objs = [], enr = [], validRows = 0, enrolOnly = 0;
      var kelasByNama = {}; Object.keys(ctx.kelas).forEach(function (id) { var k = ctx.kelas[id]; if (k.status === 'Aktif') kelasByNama[String(k.nama_kelas).replace(/\s+/g, '').toUpperCase()] = id; });
      var siswaByNisn = ctx.nisn;
      for (var i = 1; i < lines.length; i++) {
        var cells = split(lines[i]), row = {};
        head.forEach(function (h, j) { row[h] = cells[j] === undefined ? '' : cells[j]; });
        try {
          var rec = row;
          if (ent === 'siswa') {                                            // satu impor: data siswa + masuk kelas
            var nis = String(row.nisn || '').trim(); if (/^\d{6,9}$/.test(nis)) nis = pad_(nis, 10); row.nisn = nis;
            var kn = String(row.nama_kelas || '').trim(), kid2 = '';
            if (kn) { kid2 = kelasByNama[kn.replace(/\s+/g, '').toUpperCase()]; if (!kid2) throw new Error('Kelas "' + kn + '" tidak ditemukan/aktif.'); }
            var exSid = siswaByNisn[nis];
            if (exSid && kid2) { enr.push(prepare_('anggota', { id_kelas: kid2, id_siswa: exSid, no_absen: row.no_absen }, null, ctx, true)); validRows++; enrolOnly++; continue; }
            var so = prepare_('siswa', row, null, ctx, true);
            if (kid2) enr.push(prepare_('anggota', { id_kelas: kid2, id_siswa: so.id_siswa, no_absen: row.no_absen }, null, ctx, true));
            objs.push(so); validRows++; continue;
          }
          if (ent === 'anggota') {
            var nisn = String(row.nisn || ''); if (/^\d{6,9}$/.test(nisn)) nisn = pad_(nisn, 10);
            var sid = siswaByNisn[nisn]; if (!sid) throw new Error('NISN ' + row.nisn + ' tidak ditemukan di data siswa.');
            var kid = kelasByNama[String(row.nama_kelas || '').replace(/\s+/g, '').toUpperCase()]; if (!kid) throw new Error('Kelas "' + row.nama_kelas + '" tidak ditemukan/aktif.');
            rec = { id_kelas: kid, id_siswa: sid, no_absen: row.no_absen };
          }
          objs.push(prepare_(ent, rec, null, ctx, true));
        } catch (e) { errors.push({ baris: i + 1, pesan: e.message }); }
      }
      if (ent !== 'siswa') validRows = objs.length;
      var res = { ok: true, total: lines.length - 1, valid: validRows, errors: errors.slice(0, 40), error_count: errors.length };
      if (commit && (objs.length || enr.length)) {
        if (errors.length) throw new Error('Perbaiki ' + errors.length + ' baris yang salah terlebih dahulu, lalu coba lagi.');
        if (objs.length) { writeRows_(def, t, objs, true); log_(def.sheet, 'INSERT', '', '', objs.length + ' baris', 'impor ' + ent); }
        if (enr.length) { writeRows_(masters_().anggota, table_(S.ANGGOTA), enr, true); log_(S.ANGGOTA, 'INSERT', '', '', enr.length + ' baris', 'impor siswa + kelas'); res.enrolled = enr.length; }
        if (ent === 'kelas' || ent === 'mapel') syncMK_();
        res.inserted = objs.length;
      }
      return res;
    };
    return commit ? withLock_(work) : work();
  });
}

var SEKOLAH_KEYS = ['nama', 'npsn', 'nss', 'alamat', 'kode_pos', 'desa', 'kecamatan', 'kabupaten', 'provinsi', 'website', 'email', 'kepala', 'nip_kepala', 'kota_ttd', 'tanggal_rapor'];

}

function saveSekolah(v) {
  return wrap_(function () {
    adminOnly_();
    return withLock_(function () {
      var out = {};

      var t = table_(S.CONFIG), idx = idx_(t.rows, 'key'), add = [];
      SEKOLAH_KEYS.forEach(function (k) {

      });
      writeCols_(t, ['value']);

/* ----------------------------------------------------------------------------
 *  PENGATURAN CETAK — logo kiri/kanan & gambar latar (disimpan di _CONFIG, dipecah per 40.000 karakter)
 * -------------------------------------------------------------------------- */
var CETAK_IMG = { logo_kiri: 80000, logo_kanan: 80000, latar: 160000 };
var CETAK_CHUNK = 40000;

function cetakCfg_() {
  var m = {}; table_(S.CONFIG).rows.forEach(function (r) { if (r.key && String(r.key).indexOf('cetak_') === 0) m[r.key] = r.value === undefined || r.value === null ? '' : String(r.value); });
  var o = { logo_ukuran: m.cetak_logo_ukuran || '22', latar_opacity: m.cetak_latar_opacity || '12' };
  Object.keys(CETAK_IMG).forEach(function (k) {
    var n = parseInt(m['cetak_' + k + '_n'], 10) || 0, p = [];
    for (var i = 0; i < n; i++) p.push(m['cetak_' + k + '_' + i] || '');
    o[k] = p.join('');
  });
  return o;
}

function getCetakSetting() {
  return wrap_(function () { session_(); var o = cetakCfg_(); o.ok = true; return o; });
}

function saveCetakSetting(v) {
  return wrap_(function () {
    session_();
    return withLock_(function () {
      v = v || {};
      var t = table_(S.CONFIG), idx = idx_(t.rows, 'key'), add = [], changed = false;
      function put(key, val, ket) {
        val = String(val);
        var row = idx[key];
        if (row) { if (String(row.value) !== val) { row.value = val; changed = true; } }
        else if (val !== '') { var o = { key: key, value: val, keterangan: ket || 'Pengaturan cetak' }; add.push(o); idx[key] = o; }
      }
      var ukr = parseInt(v.logo_ukuran, 10), opa = parseInt(v.latar_opacity, 10);
      if (v.logo_ukuran !== undefined) { if (!(ukr >= 10 && ukr <= 40)) throw new Error('Ukuran logo harus 10-40 mm.'); put('cetak_logo_ukuran', ukr); }
      if (v.latar_opacity !== undefined) { if (!(opa >= 3 && opa <= 40)) throw new Error('Kepekatan latar harus 3-40%.'); put('cetak_latar_opacity', opa); }
      Object.keys(CETAK_IMG).forEach(function (k) {
        if (v[k] === undefined) return;
        var d = String(v[k] || '');
        if (d && !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(d)) throw new Error('Format gambar tidak valid (harus PNG/JPEG/WEBP).');
        if (d.length > CETAK_IMG[k]) throw new Error('Gambar terlalu besar. Gunakan gambar yang lebih kecil.');
        var old = parseInt((idx['cetak_' + k + '_n'] || {}).value, 10) || 0, n = Math.ceil(d.length / CETAK_CHUNK);
        for (var i = 0; i < Math.max(n, old); i++) put('cetak_' + k + '_' + i, d.substr(i * CETAK_CHUNK, CETAK_CHUNK), 'Gambar cetak (potongan)');
        put('cetak_' + k + '_n', n);
        log_(S.CONFIG, 'UPDATE', 'cetak_' + k, '', d ? 'gambar ' + d.length + ' karakter' : 'dihapus', 'pengaturan cetak');
      });
      if (changed) writeCols_(t, ['value']);
      if (add.length) appendObjs_(t, add);
      return { ok: true };
    });
  });
}

var DR_TEXT = ['ekskul_1', 'predikat_1', 'ket_1', 'ekskul_2', 'predikat_2', 'ket_2', 'ekskul_3', 'predikat_3', 'ket_3', 'tinggi_badan', 'berat_badan', 'kondisi_kesehatan', 'prestasi', 'catatan_wali', 'keputusan'];

var DR_KEPUTUSAN = ['', 'Naik', 'Tinggal', 'Lulus'];

function drIndex_() { return idx_(table_(S.DR).rows, 'id_anggota'); }

function drBlank_() {
  var o = {}; DR_TEXT.forEach(function (k) { o[k] = ''; }); DR_NUM.forEach(function (k) { o[k] = 0; }); return o;
}

function drOut_(r) {
  var o = drBlank_();
  if (r) { DR_TEXT.forEach(function (k) { o[k] = r[k] === undefined || r[k] === null ? '' : String(r[k]); }); DR_NUM.forEach(function (k) { o[k] = num_(r[k]) || 0; }); }

}

  return wrap_(function () {

    var siswa = anggotaAktif_(idKelas).map(function (a) { var o = drOut_(idx[a.id_anggota]); o.id_anggota = a.id_anggota; o.no_absen = a.no_absen; o.nama = a.nama; return o; });

}

/** items: [{id_anggota, ...field}] — hanya field yang dikirim yang diubah. */
function saveDataRapor(idKelas, items) {
  return wrap_(function () {
    walAuth_(idKelas);
    return withLock_(function () {
      if (!items || !items.length) throw new Error('Tidak ada data untuk disimpan.');
      var ang = {}; anggotaAktif_(idKelas).forEach(function (a) { ang[a.id_anggota] = a; });
      var t = table_(S.DR), idx = idx_(t.rows, 'id_anggota'), errors = [], add = [], saved = 0;
      items.forEach(function (it) {
        var a = ang[it.id_anggota]; if (!a) { errors.push(it.id_anggota + ': bukan anggota aktif kelas ini'); return; }
        var upd = {}, bad = '';
        DR_TEXT.forEach(function (k) {
          if (it[k] === undefined) return;
          var v = String(it[k] === null ? '' : it[k]).trim();
          if (v.length > 600) bad = k + ' terlalu panjang (maks 600 karakter)';
          if (/^predikat_/.test(k) && DR_PREDIKAT.indexOf(v) < 0) bad = 'Predikat ekstrakurikuler harus ' + DR_PREDIKAT.slice(1).join('/');
          if (k === 'keputusan' && DR_KEPUTUSAN.indexOf(v) < 0) bad = 'Keputusan harus ' + DR_KEPUTUSAN.slice(1).join('/');
          upd[k] = v;
        });
        DR_NUM.forEach(function (k) {
          if (it[k] === undefined) return;
          var n = num_(it[k]); if (n === null) n = 0;
          if (!Number.isInteger(n) || n < 0 || n > 366) bad = 'Jumlah ' + k + ' harus bilangan bulat 0-366';
          upd[k] = n;
        });
        if (bad) { errors.push(a.nama + ': ' + bad); return; }
        var ex = idx[it.id_anggota];
        if (!ex) { ex = drBlank_(); ex.id_anggota = it.id_anggota; add.push(ex); idx[it.id_anggota] = ex; }
        Object.keys(upd).forEach(function (k) { ex[k] = upd[k]; });
        saved++; log_(S.DR, 'UPDATE', it.id_anggota, '', Object.keys(upd).join(','), 'data rapor siswa');
      });
      if (add.length) appendObjs_(t, add);
      writeCols_(t, DR_TEXT.concat(DR_NUM));
      return { ok: true, saved: saved, errors: errors };
    });
  });
}
