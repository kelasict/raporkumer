<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapor Kurikulum Merdeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#0e2a2f; --muted:#5d7378; --line:#e1eae9; --bg:#f2f6f5; --card:#fff;
  --brand:#0f766e; --brand-d:#0a5550; --brand-l:#d8f1ed; --accent:#f59e0b; --accent-l:#fef3c7;
  --ok:#15803d; --ok-l:#dcfce7; --bad:#dc2626; --bad-l:#fee2e2; --info:#2563eb; --info-l:#dbeafe;
  --r:16px; --shadow:0 1px 2px rgba(14,42,47,.06),0 10px 28px rgba(14,42,47,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.hide{display:none!important}

/* ---------- Layout ---------- */
.side{position:fixed;inset:0 auto 0 0;width:256px;background:linear-gradient(175deg,#0a3a3a 0%,#0f766e 62%,#14917f 100%);color:#e8fbf8;display:flex;flex-direction:column;padding:20px 14px;z-index:40;transition:transform .25s}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 22px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#fde68a,#f59e0b);display:grid;place-items:center;color:#0a3a3a;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;color:#fff}
.brand span{font-size:11.5px;color:#a7e3da}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:transparent;color:#c9f0ea;cursor:pointer;text-align:left;font-weight:600;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7fcfc3;padding:16px 14px 6px;font-weight:700}
.me{margin-top:auto;background:rgba(0,0,0,.18);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.ava{width:38px;height:38px;border-radius:50%;background:#fde68a;color:#0a3a3a;font-weight:800;display:grid;place-items:center;flex:none}
.me div{min-width:0}.me b{display:block;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:#a7e3da;font-size:11.5px}
.main{margin-left:0;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 32px;position:sticky;top:0;background:rgba(242,246,245,.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;border:0;background:#fff;border-radius:11px;width:40px;height:40px;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.ta-chip{background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--brand-d);white-space:nowrap}
.page{padding:26px 32px 60px;max-width:1280px;width:100%}
.demo-bar{background:linear-gradient(90deg,#fef3c7,#fde68a);color:#6b4500;padding:9px 32px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #f6d77a}
.demo-bar b{font-weight:800}.demo-bar select,.demo-bar button{background:#fff;border:1px solid #e9c466;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px;font-weight:600}
.scrim{display:none}

/* ---------- Komponen ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#b9ccca;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.28)}
.btn.pri:hover{background:var(--brand-d)}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#3b2600}
.btn.danger{background:#fff;color:var(--bad);border-color:#f3b4b4}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eef3f2;color:var(--muted)}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.bad{background:var(--bad-l);color:var(--bad)}.chip.warn{background:var(--accent-l);color:#92580a}.chip.info{background:var(--info-l);color:var(--info)}.chip.brand{background:var(--brand-l);color:var(--brand-d)}
.pred{display:inline-block;min-width:34px;text-align:center;padding:3px 9px;border-radius:8px;font-weight:800;font-size:12.5px}
.pred.A,.pred.SB{background:#bbf7d0;color:#14532d}.pred.D{background:#fecaca;color:#7f1d1d}.pred.B{background:#ccfbf1;color:#115e59}.pred.C{background:#fde68a;color:#78350f}.pred.PB{background:#fecaca;color:#7f1d1d}
.bar{height:8px;border-radius:99px;background:#e6efee;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#2dd4bf);transition:width .5s}
.hero{border-radius:22px;padding:28px 30px;color:#fff;background:radial-gradient(1200px 300px at 100% -20%,rgba(253,230,138,.35),transparent 60%),linear-gradient(120deg,#0a3a3a,#0f766e 70%,#14b8a6);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h2{font-size:25px;font-weight:800;margin-bottom:4px}.hero p{margin:0;color:#c9f0ea;max-width:620px}
.hero:after{content:'';position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.tile{padding:16px 18px;display:flex;gap:14px;align-items:center}
.tile .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand-d);flex:none}
.tile b{display:block;font-size:24px;font-weight:800;line-height:1.1}.tile span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.acard{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s;cursor:pointer;position:relative}
.acard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(14,42,47,.12);border-color:#b9ddd8}
.acard h3{font-size:17px;font-weight:800}
.acard .kls{display:inline-flex;gap:6px;align-items:center}
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}.sechead h2{font-size:16px;font-weight:800}
.tabs{display:flex;gap:6px;background:#e7efee;padding:5px;border-radius:14px;width:max-content;max-width:100%;overflow:auto;margin:16px 0}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 8px rgba(14,42,47,.1)}
.seg{display:inline-flex;background:#e7efee;border-radius:11px;padding:3px}.seg button{border:0;background:transparent;padding:6px 13px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ---------- Tabel nilai ---------- */
.tw{overflow:auto;border-radius:var(--r);max-height:calc(100vh - 330px);min-height:140px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:#f6faf9;z-index:3;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;vertical-align:bottom}
thead th small{display:block;text-transform:none;letter-spacing:0;font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis;color:#7d9296}
tbody tr:hover td{background:#fafdfc}
td.c,th.c{text-align:center}
.stk{position:sticky;left:0;background:#fff;z-index:2}.stk2{position:sticky;left:46px;background:#fff;z-index:2;box-shadow:2px 0 0 var(--line)}
thead th.stk,thead th.stk2{z-index:4;background:#f6faf9}
tbody tr:hover td.stk,tbody tr:hover td.stk2{background:#fafdfc}
.ni{width:68px;text-align:center;padding:7px 4px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-variant-numeric:tabular-nums;transition:.12s}
.ni:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.ni.low{background:#fff1f1;color:var(--bad);border-color:#f7caca}.ni.hi{background:#effcf4;color:var(--ok);border-color:#bde8cb}
.ni.dirty{border-color:var(--accent);background:#fffbeb;color:#92580a}.ni.err{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.ni:disabled{background:#f3f6f6;color:#a2b3b5;cursor:not-allowed;border-style:dashed}
.rem{display:block;font-size:10.5px;color:var(--info);font-weight:700;margin-top:2px}
.avg{font-weight:800;font-variant-numeric:tabular-nums}
.savebar{position:sticky;bottom:14px;margin-top:14px;display:flex;justify-content:flex-end;pointer-events:none;z-index:6}
.savebar>div{pointer-events:auto;background:#0e2a2f;color:#fff;padding:10px 12px 10px 20px;border-radius:16px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 40px rgba(14,42,47,.35)}
.savebar .btn{border:0}

/* ---------- Capaian ---------- */
.cap{padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.cap .n{width:40px;height:40px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800}
.cap p{margin:6px 0 0;font-size:15px;line-height:1.6}
.cap.mt p{opacity:.55;font-style:italic}
.cap .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.quote{border-left:4px solid var(--brand);background:#f3fbf9;padding:10px 14px;border-radius:0 12px 12px 0}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* ---------- Modal / toast ---------- */
.mback{position:fixed;inset:0;background:rgba(10,30,34,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal header{padding:20px 24px 4px;display:flex;align-items:center;gap:10px}.modal header h3{font-size:18px;font-weight:800;flex:1}
.modal .body{padding:10px 24px 8px}.modal footer{padding:14px 24px 22px;display:flex;gap:10px;justify-content:flex-end}
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
.inp,textarea.inp,select.inp{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.55}
.cnt{text-align:right;font-size:12px;color:var(--muted)}.cnt.bad{color:var(--bad);font-weight:700}
.note{padding:11px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--accent-l);color:#7a4a05}.note.bad{background:var(--bad-l);color:#8b1d1d}.note.info{background:var(--info-l);color:#1e40af}.note.ok{background:var(--ok-l);color:#14532d}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:99;max-width:min(420px,calc(100vw - 40px))}
.toast{background:#0e2a2f;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;gap:11px;align-items:flex-start;animation:slide .22s;border-left:4px solid #2dd4bf}
.toast.bad{border-color:#f87171}.toast.warn{border-color:var(--accent)}
.boot{position:fixed;inset:0;background:linear-gradient(150deg,#0a3a3a,#0f766e);display:grid;place-items:center;z-index:100;color:#fff;text-align:center;padding:20px}
.boot::after{content:'Versi 5.3 · login langsung';position:absolute;bottom:10px;left:0;right:0;font-size:11px;color:#8fd6cc;opacity:.8}
.boot .logo{width:68px;height:68px;border-radius:20px;margin:0 auto 18px}
.boot h2{font-size:24px;font-weight:800}.boot p{color:#b6ece4;max-width:440px;margin:8px auto 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fde68a;animation:rot .8s linear infinite;margin:20px auto 0}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,#e8f0ef 25%,#f4f8f7 37%,#e8f0ef 63%);background-size:400% 100%;animation:sh 1.3s infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}
.view-in{animation:vin .25s}@keyframes vin{from{opacity:0;transform:translateY(8px)}}


/* ---------- Checklist & setup ---------- */
.chk{padding:6px 22px 14px}.chk-row{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.chk-row:first-child{border-top:0}
.chk-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:#eef3f2;color:var(--muted)}
.chk-ic.ok{background:var(--ok-l);color:var(--ok)}.chk-ic.warn{background:var(--accent-l);color:#92580a}.chk-ic.todo{background:#fff;border:2px dashed #b9ccca}
.chk-t{flex:1;min-width:0}
.boot.lg{background:linear-gradient(160deg,#fdf3e7 0%,#fbe6d4 55%,#f9dcc6 100%);color:#4a3426}
.boot.lg::after{color:#b08c76}
.lgwrap{width:min(420px,92vw);margin:0 auto}
.lgbrand{font-size:13px;font-weight:700;letter-spacing:.06em;color:#a9744f;text-transform:uppercase;margin-bottom:14px}
.lgcard{background:#fffaf4;border-radius:26px;padding:34px 30px 26px;text-align:left;box-shadow:0 24px 60px rgba(176,120,82,.22),0 2px 0 #fff inset}
.lgcard h2{font-size:22px;font-weight:800;letter-spacing:.28em;text-align:center;color:#3d2b20;margin:0 0 26px}
.lgcard label{display:block;font-size:12.5px;font-weight:700;color:#8a6b58;margin:14px 0 6px}
.lgcard .in{width:100%;padding:13px 15px;border:1.5px solid #efdccd;border-radius:14px;background:#fff;font:inherit;font-size:15px;color:#3d2b20;outline:none;transition:.15s}
.lgcard .in:focus{border-color:#f0996b;box-shadow:0 0 0 4px rgba(240,153,107,.18)}
.lgcard .pw{position:relative}.lgcard .pw .in{padding-right:56px}
.lgcard .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:#a9744f;padding:8px;border-radius:10px;font-size:12px;font-weight:700}
.lgcard .go{width:100%;margin-top:22px;padding:14px;border:0;border-radius:15px;font:inherit;font-size:15px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#f9b48b,#ef8a5b);box-shadow:0 10px 24px rgba(239,138,91,.38);cursor:pointer;transition:.15s}
.lgcard .go:hover{filter:brightness(1.05);transform:translateY(-1px)}.lgcard .go:disabled{opacity:.6;cursor:wait;transform:none}
.lgcard .err{margin-top:14px;padding:10px 13px;border-radius:12px;background:#fde8e4;color:#a3321f;font-size:13px;font-weight:600}
.lgcard .inf{margin-top:14px;padding:10px 13px;border-radius:12px;background:#fdf0d5;color:#8a5a12;font-size:13px;font-weight:600}
.lgcard .foot{margin:20px 0 0;text-align:center;font-size:12.5px;color:#a58872}
.lgcard .hint{margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff1e3;font-size:12.5px;color:#8a6b58;line-height:1.9}
.lgcard .hint button{border:0;background:#fff;border-radius:8px;padding:3px 9px;margin:2px 4px 2px 0;font:inherit;font-size:12px;font-weight:700;color:#b9622f;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lgcard .note2{font-size:12.5px;color:#8a6b58;line-height:1.7;margin:-10px 0 4px;text-align:center}
.cell{width:100%;min-width:90px;border:1px solid transparent;background:transparent;padding:5px 7px;font:inherit;font-size:12.5px;border-radius:6px;color:inherit}
.cell:hover{border-color:#cfe0dc;background:#fff}.cell:focus{outline:none;border-color:var(--brand);background:#fff}.cell.dirty{background:#fff4d6;border-color:#f3c35b}
.edtable td{padding:2px 4px}.edtable th{white-space:nowrap}
.login-card{background:#fff;color:var(--ink);text-align:left;border-radius:22px;padding:26px 26px 22px;width:min(440px,92vw);margin:22px auto 0;box-shadow:0 30px 80px rgba(0,0,0,.32)}
.login-card h3{font-size:17px;margin:0 0 2px}.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.acc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line,#d9e5e2);border-radius:14px;background:#f6faf9;width:100%;text-align:left;font:inherit;color:inherit;cursor:default}
button.acc{cursor:pointer;transition:.15s}button.acc:hover{border-color:#0f766e;background:#ecfdf5}
.acc .ava{width:42px;height:42px;font-size:17px}.acc b{display:block;font-size:14.5px;line-height:1.25}.acc small{color:var(--muted);font-size:12px;word-break:break-all}
.login-card .big{width:100%;justify-content:center;margin-top:14px;padding:13px 16px;font-size:15px}
.login-card .lk{display:block;text-align:center;margin-top:14px;font-size:13px;color:#0f766e;font-weight:600;text-decoration:none;background:none;border:0;cursor:pointer;width:100%}
.login-card .lk:hover{text-decoration:underline}
.login-card .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0 10px}.login-card .sep:before,.login-card .sep:after{content:'';flex:1;height:1px;background:#e3ecea}
.login-card .accs{display:grid;gap:8px}.boot .school{color:#fde68a;font-weight:700;margin-top:6px;letter-spacing:.02em}
.setup-card{background:#fff;color:var(--ink);text-align:left;border-radius:20px;padding:24px;max-width:540px;margin:22px auto 0;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.setup-card ol{margin:0 0 14px;padding-left:20px;line-height:1.8}
code{background:#eef3f2;padding:1px 6px;border-radius:6px;font-size:12.5px}
.seg{flex-wrap:wrap}

/* ---------- Menu utama bergaya tombol warna ---------- */
.mgrp{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin:24px 0 10px}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:2px solid rgba(0,0,0,.14);cursor:pointer;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.14);transition:.12s;min-height:74px}
.mt:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.14)}.mt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.mt small{display:block;text-transform:none;font-weight:500;font-size:12px;letter-spacing:0;opacity:.88;margin-top:2px}
.mt .mi{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.32);display:grid;place-items:center;flex:none}
.note.big{padding:14px 16px;align-items:center;font-size:14px}
.usr{display:flex;gap:10px;align-items:center}.usr b{display:block;font-size:13px;line-height:1.2}.usr small{color:var(--muted);font-size:11.5px}

<script>
/* Diagnostik: tampilkan galat JavaScript di layar muat bila halaman login gagal tampil. */
window.__errs = [];
function __bootMsg(t) { var b = document.getElementById('boot'), m = document.getElementById('bootmsg'); if (m && b && !/hide/.test(b.className)) m.textContent = t; }
/* Cari bagian skrip yang tidak bisa di-parse: pecah per pernyataan tingkat atas, periksa tiap bagian dengan mesin JS yang sama. */
function __locate(code) {
  var L = code.split('\n'), starts = [], out = [];
  for (var i = 0; i < L.length; i++) if (/^(function|async function|const|let|var|class|\/\*|\/\/)/.test(L[i])) starts.push(i);
  starts.push(L.length);
  for (var k = 0; k < starts.length - 1 && out.length < 3; k++) {
    var chunk = L.slice(starts[k], starts[k + 1]).join('\n');
    try { new Function(chunk); } catch (x) { out.push('baris ' + (starts[k] + 1) + '-' + starts[k + 1] + ' [' + (x && x.message) + '] ' + L[starts[k]].slice(0, 70)); }
  }
  return out.length ? 'Bagian bermasalah: ' + out.join(' || ') : 'Bagian bermasalah tidak ditemukan (tiap bagian valid bila dipisah).';
}
window.__located = false;
window.addEventListener('error', function (e) {
  var t = (e.message || 'error') + (e.lineno ? ' (baris ' + e.lineno + ', kolom ' + (e.colno || '?') + ')' : '');
  try {
    if (window.__appCode && e.lineno) { var ln = window.__appCode.split('\n')[e.lineno - 1] || '', c = Math.max((e.colno || 1) - 1, 0); t += ' >> ' + ln.slice(Math.max(c - 60, 0), c + 40); }
    if (window.__appCode && /SyntaxError/.test(e.message || '') && !window.__located) { window.__located = true; t += ' ## ' + __locate(window.__appCode); }
  } catch (x) { }
  window.__errs.push(t); __bootMsg('Galat skrip: ' + window.__errs.join(' | '));
});
window.addEventListener('unhandledrejection', function (e) { window.__errs.push(String(e.reason && e.reason.message || e.reason)); });
setTimeout(function () {
  if (!document.getElementById('lgU')) __bootMsg('Halaman login belum tampil. ' + (window.__errs.length ? window.__errs.join(' | ') : 'Tidak ada galat tercatat; skrip utama kemungkinan tidak berjalan.'));
}, 5000);
</script>
